<!DOCTYPE html>
<html lang="en">

<head>
    <title>Gallery</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/89138ebf6b.js" crossorigin="anonymous"></script>
</head>

<body>
    <header>
        <div id="header-upper">
            <a href="index.html">
                <img class="header-logo" id="header-logo" src="icon/Client3_LogoPalette1-yellow.png"
                    alt="Book Haven Bookstore Logo">
            </a>
            <h1 id="client-name">Book<br>Haven<br>Bookstore</h1>
        </div>

        <nav>
            <ul class="navbar-list">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="events.html">Events</a></li>
            </ul>

            <button class="navbar">
                <i class="fa-solid fa-bars burger"></i>
                <ul class="navbar-list-mobile">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="events.html">Events</a></li>
                </ul>
            </button>
        </nav>
    </header>

    <main>
        <section class="gallery-container">
            <div class="view-cart-header" id="view_cart_header">
                <h2>Book Selection</h2>
                <button type="button" class="view-cart-button" id="click_viewCart">
                    View Cart
                </button>
            </div>

            <section class="gallery-book-grid" id="productsGrid">
                <!-- Javascript function for this   -->
            </section>
        </section>

    </main>

    <div class="modal">
        <div class="viewCart-modal-section">
            <div class="viewCart-modal-container bg-box">

                <!-- view cart button to view the splash page  -->
                <div class="viewCart-modal-header">
                    <h3 class="modal-title" id="viewCart_items">Shopping Cart</h3>
                    <button type="button" class="exit-viewCart" id="exit_viewCart"><i
                            class="fa-solid fa-xmark"></i></button>
                </div>

                <div class="divider"></div>

                <!-- view page where added items are listed -->
                <div class="viewCart-modal-body" id="cart_items">
                    <div class="modal-viewCart-modal-container" id="productsModal">
                          <!-- Javascript function for this   -->
                    </div>

                </div>

                <div class="divider"></div>

                <!-- view cart splash page showing pricing calc -->
                <div class="viewCart-modal-footer" >
                    <div class="viewCart-cart-total">Total (0 items) : $0.00 </div>
                    
                    <div>
                        <button type="button" class="clear-cartItems" id="clear_cartItems">Clear Cart</button>
                        <button type="button" class="checkout-cartItems" id="checkout_cartItems">Checkout</button>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <footer>
        <div class="footer-container">
            <div class="newsletter-section">
                <h3>Signup for our Newsletter!</h3>
                <div class="newsletter-container">
                    <input type="email" placeholder="Your Email" id="subscribe-email" required>
                    <button id="subscribe-button">Subscribe</button>
                </div>
            </div>

            <div class="social-media-section">
                <h3>Connect With Us</h3>
                <div class="social-media-container">
                    <a href="#"><i class="fa-brands fa-instagram"></i> </a>
                    <a href="#"><i class="fa-brands fa-facebook"></i> </a>
                    <a href="#"><i class="fa-brands fa-x-twitter"></i> </a>
                    <a href="#"><i class="fa-brands fa-youtube"></i> </a>
                </div>
            </div>
        </div>

        <div class="footer-links">
            <h3>Quick Links</h3>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="gallery.html">Gallery</a>
            <a href="events.html">Events</a>
        </div>


        <div class="copy-right-patent-or-something">
            <p>&copy; 2025 BOOK HEAVEN BOOKSTORE. All rights reserved.</p>
        </div>
    </footer>
    

    <script type="module" src="script.js"></script>
    
    
</body>

</html>
