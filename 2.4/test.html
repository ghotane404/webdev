<!DOCTYPE html>
<html>
  <head>
    <style>
      html {
        box-sizing: border-box;
      }

      .flex-container {
        display: flex;
        flex-direction: row;
        font-size: 30px;
        text-align: center;
      }


      img {
        padding:10px;
        margin: 15px;
      }


      @media (max-width: 400px) {
        .flex-container {
          flex-direction: column;
        }
      }

    </style>
  </head>


  <body>

    <h1>Cupcake Special</h1>

    <div class = "flex-container">
      <img src = "https://upload.wikimedia.org/wikipedia/commons/thumb/1/18/Colourful_First_Birthday_Cupcakes_%283502231880%29.jpg/640px-Colourful_First_Birthday_Cupcakes_%283502231880%29.jpg">
      <img src = "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c4/Pink_Princess_Birthday_Cupcakes_%283808078114%29.jpg/640px-Pink_Princess_Birthday_Cupcakes_%283808078114%29.jpg">
    </div>

  </body>
</html>
